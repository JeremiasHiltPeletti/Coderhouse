<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="../images/pitbull_gym_logo.png"
      type="image/x-icon"
    />
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="../main.js" defer></script>

    <title>Pitbull Gym</title>
  </head>
  <body>
    <header class="menu">
      <a href="../index.html">
        <img src="../images/pitbull_gym_logo.png" alt="logo" />
      </a>

      <nav class="miNav">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="micuenta.html">Mi Cuenta</a></li>
        </ul>

        <div class="menu-toggle">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>
    </header>

    <div class="container">
      <form id="contact" action="" method="post">
        <h3>Contacto</h3>
        <h4>¿Tienes una duda? Deja tus datos debajo</h4>
        <fieldset>
          <input
            placeholder="Nombre"
            type="text"
            tabindex="1"
            required
            autofocus
          />
        </fieldset>
        <fieldset>
          <input placeholder="Email" type="email" tabindex="2" required />
        </fieldset>
        <fieldset>
          <input
            placeholder="Numero de teléfono (opcional)"
            type="tel"
            tabindex="3"
          />
        </fieldset>
        <fieldset>
          <textarea
            placeholder="Escribe tu mensaje"
            tabindex="5"
            required
          ></textarea>
        </fieldset>
        <fieldset>
          <button
            name="submit"
            type="submit"
            id="contact-submit"
            data-submit="...Sending"
          >
            Enviar
          </button>
        </fieldset>
      </form>
    </div>
  </body>
</html>
